spring:
  application:
    name: codeagent-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    default-property-inclusion: non_null

server:
  address: 127.0.0.1
  port: 8000

logging:
  file:
    name: ${CODEAGENT_LOG_FILE:../logs/codeagent-backend.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 5
      total-size-cap: 50MB

codeagent:
  retrieval:
    enabled: ${RETRIEVAL_ENABLED:false}
    storage-dir: ${RETRIEVAL_STORAGE_DIR:../workspaces/retrieval-index}
    qwen-api-key: ${RETRIEVAL_QWEN_API_KEY:}
    qdrant-url: ${RETRIEVAL_QDRANT_URL:}
    qdrant-api-key: ${RETRIEVAL_QDRANT_API_KEY:}
    deepseek-api-key: ${RETRIEVAL_DEEPSEEK_API_KEY:}
  memory:
    state-file: ${CODEAGENT_MEMORY_STATE_FILE:../memories/memories.json}
    max-entries: 1000
    max-selected-entries: 12
    selection-token-budget: 1200
    consolidation-max-operations: 8
    consolidation-max-output-tokens: 1024
    consolidation-timeout: PT20S
  context:
    context-window-tokens: 32768
    reserved-output-tokens: 4096
    spill-threshold-chars: 12000
    compact-tool-result-chars: 2000
    max-retrieval-chars: 8000
    minimum-retained-turns: 2
    compaction-target-ratio: 0.75
    summary-max-output-tokens: 2048
    result-directory: ${CODEAGENT_CONTEXT_RESULT_DIRECTORY:../runs/context-results}
  session:
    directory: ${CODEAGENT_SESSION_DIRECTORY:../sessions}
  workspace:
    state-file: ${CODEAGENT_WORKSPACE_STATE_FILE:../workspaces/authorized-workspaces.json}
